name: Update AED-PKR rates daily

on:
  schedule:
    # Runs at 06:00 UTC = 10:00 AM UAE time, every day.
    # Change the numbers below if you want a different time.
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run the rate updater
        run: python scraper.py

      - name: Commit updated rates.json
        run: |
          git config user.name "rate-bot"
          git config user.email "rate-bot@users.noreply.github.com"
          git add rates.json
          git diff --staged --quiet || git commit -m "Daily rate update"
          git pull --rebase origin main
          git push
